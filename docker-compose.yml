services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env.backend
    volumes:
      - ./backend:/var/www
      - /var/www/vendor

  frontend-applicant:
    build:
      context: ./frontend-applicant
    ports:
      - "5173:5173"
    env_file:
      - .env.frontend
    volumes:
      - ./frontend-applicant:/app
      - /app/node_modules

  frontend-reviewer:
    build:
      context: ./frontend-reviewer
    ports:
      - "5174:5174"
    env_file:
      - .env.frontend
    volumes:
      - ./frontend-reviewer:/app
      - /app/node_modules
