services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www
      - /var/www/vendor
    environment:
      - APP_ENV=local
      - APP_DEBUG=true

  frontend-applicant:
    build:
      context: ./frontend-applicant
    ports:
      - "5173:5173"
    volumes:
      - ./frontend-applicant:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000

  frontend-reviewer:
    build:
      context: ./frontend-reviewer
    ports:
      - "5174:5174"
    volumes:
      - ./frontend-reviewer:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
